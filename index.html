<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#fbe9ee" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Твой торт" />
    <meta name="format-detection" content="telephone=no" />
    <title>Твой торт</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Manrope:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="bg" aria-hidden="true">
      <div class="bg-layer bg-day"></div>
      <div class="bg-layer bg-night"></div>
      <div class="bg-layer bg-party"></div>
    </div>

    <canvas id="scene"></canvas>

    <div class="ui">
      <header class="hud">
        <ol class="steps" id="steps"></ol>
        <button class="icon-button" id="sound" aria-label="Выключить звук" type="button">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z" fill="currentColor" />
            <path class="wave" d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            <path class="mute" d="M16 9.5l5 5M21 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          </svg>
        </button>
      </header>

      <section class="sheet" id="sheet" hidden>
        <div class="sheet-panel" id="panel-shape" data-step="0">
          <div class="chips" id="shape-chips" role="radiogroup" aria-label="Форма"></div>
          <p class="sheet-note" id="shape-note"></p>
        </div>

        <div class="sheet-panel" id="panel-color" data-step="1">
          <div class="field">
            <p class="field-label">Бисквит <span class="field-value" id="sponge-value"></span></p>
            <div class="swatches" id="sponge-swatches" role="radiogroup" aria-label="Бисквит"></div>
          </div>
          <div class="field">
            <p class="field-label">Крем <span class="field-value" id="cream-value"></span></p>
            <div class="swatches" id="cream-swatches" role="radiogroup" aria-label="Крем"></div>
          </div>
          <div class="field">
            <p class="field-label">Глазурь <span class="field-value" id="glaze-value"></span></p>
            <div class="swatches" id="glaze-swatches" role="radiogroup" aria-label="Глазурь"></div>
          </div>
          <div class="field">
            <p class="field-label">Бордюр</p>
            <div class="chips chips-small" id="border-chips" role="radiogroup" aria-label="Бордюр"></div>
          </div>
        </div>

        <div class="sheet-panel" id="panel-decor" data-step="2">
          <div class="tray" id="tray" role="radiogroup" aria-label="Декор"></div>
          <div class="tray-actions">
            <p class="sheet-note" id="decor-note"></p>
            <div class="tray-buttons">
              <button class="text-button" id="undo" type="button">Отменить</button>
              <button class="text-button" id="clear" type="button">Очистить</button>
            </div>
          </div>
        </div>

        <nav class="sheet-nav">
          <button class="ghost-button" id="back" type="button"></button>
          <button class="primary-button" id="next" type="button"></button>
        </nav>
      </section>

      <div class="bottom">
        <p class="hint" id="hint"></p>
        <button class="ghost-button" id="mic" type="button" hidden>
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor" />
            <path d="M6 11a6 6 0 0 0 12 0M12 17v4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          </svg>
          <span id="mic-label"></span>
        </button>
      </div>

      <section class="screen start" id="start">
        <p class="eyebrow" id="start-eyebrow"></p>
        <h1 class="title" id="start-title"></h1>
        <p class="lead" id="start-lead"></p>
        <button class="primary-button" id="start-button" type="button"></button>
      </section>

      <section class="screen finale" id="finale" hidden>
        <div class="finale-top">
          <h2 class="title" id="finale-title"></h2>
          <p class="finale-lead" id="finale-lead"></p>
        </div>
        <div class="finale-actions">
          <button class="primary-button" id="save-button" type="button"></button>
          <button class="ghost-button" id="again-button" type="button"></button>
        </div>
      </section>

      <section class="overlay overlay-top" id="wish" hidden>
        <form class="letter-paper wish-paper" id="wish-form" autocomplete="off">
          <p class="eyebrow" id="wish-eyebrow"></p>
          <h2 class="letter-title wish-title" id="wish-title"></h2>
          <p class="wish-lead" id="wish-lead"></p>
          <ol class="wish-lines" id="wish-lines"></ol>
          <div class="wish-actions">
            <button class="text-button" id="wish-skip" type="button"></button>
            <button class="primary-button" id="wish-send" type="submit"></button>
          </div>
        </form>
      </section>

      <section class="overlay" id="saved" hidden>
        <figure class="saved-figure">
          <button class="icon-button overlay-close" data-close type="button" aria-label="Закрыть">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            </svg>
          </button>
          <img id="saved-image" alt="Твой торт" />
          <figcaption id="saved-hint"></figcaption>
        </figure>
      </section>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
