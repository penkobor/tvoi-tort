<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Твой торт">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1b1233">
  <meta property="og:title" content="Для тебя 🎂">
  <meta property="og:description" content="Маленькая скачка в честь твоего дня рождения">
  <title>Твой торт</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bad+Script&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app">
    <canvas id="c"></canvas>
    <div id="vignette"></div>
    <div id="flash"></div>
    <div class="bar bar-top"></div>
    <div class="bar bar-bottom"></div>

    <div id="hud">
      <div id="wish-slots"></div>
      <div id="sparkle-count">✦ <b>0</b></div>
    </div>

    <div id="toast"></div>
    <div id="caption"></div>
    <div id="hint"></div>

    <section id="title-screen">
      <div class="title-top">
        <div class="kicker">для тебя</div>
        <h1 class="title">С днём<br>рождения</h1>
        <div class="ornament"><span></span>✦<span></span></div>
        <p class="subtitle">Собери мои пожелания по&nbsp;дороге к&nbsp;торту</p>
      </div>
      <div class="title-bottom">
        <button id="start-btn" type="button"><span class="shine"></span>Начать</button>
        <div class="controls-hint"><span>← → свайп — тропа</span><span>тап — прыжок</span></div>
      </div>
    </section>

    <div id="music-dock">
      <div class="music-label"><span class="note">♫</span> <span id="music-title"></span></div>
      <div class="yt-frame"><div id="yt-player"></div></div>
      <div class="music-nudge">Нажми ▶, чтобы включить песню</div>
    </div>

    <section id="cake-ui">
      <div class="cake-prompt">Загадай желание<small>и коснись экрана, чтобы задуть свечи</small></div>
      <button id="mic-btn" type="button">🎤 Задуть по-настоящему</button>
      <div id="mic-meter-wrap"><div id="mic-meter"></div></div>
    </section>

    <section id="message">
      <div class="msg-card">
        <div class="msg-heart">❤</div>
        <h2 id="msg-title"></h2>
        <div id="msg-body"></div>
        <div id="msg-love"></div>
        <div class="msg-actions">
          <button id="relight-btn" type="button">🕯 Зажечь свечи снова</button>
          <button id="replay-btn" type="button">🐎 Ещё раз</button>
        </div>
      </div>
    </section>

    <canvas id="confetti"></canvas>
    <button id="mute-btn" type="button" aria-label="Звук">🔊</button>

    <div id="loader">
      <div class="loader-inner">
        <div class="loader-title">Минутку…</div>
        <div class="loader-track"><div id="loader-bar"></div></div>
      </div>
    </div>
  </div>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
